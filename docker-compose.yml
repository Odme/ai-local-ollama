services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-models
    ports:
      - "11434:11434"  # ✅ Puerto correcto
    volumes:
      - ollama_:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0  # ✅ Accesible desde fuera del container
    restart: unless-stopped
    # ✅ En Mac M4, Ollama ya usa Metal automáticamente dentro del container
networks:
  ai-network:
    driver: bridge
volumes:
  ollama_:
